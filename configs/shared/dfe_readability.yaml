      data_type: NUMERIC
      min_value: 0
      max_value: 1
      description: Output is relevant to the source input and requested audience.
      allowed_score_sources: *llm_and_human_sources
    required_inputs: *single_output_inputs
    variables:
      - query
      - generation
    output_schema: *numeric_judge_schema

