      allowed_score_sources: *llm_and_human_sources
    required_inputs: *single_output_inputs
    variables: *judge_variables
    output_schema: *numeric_judge_schema

human_review:
  enabled: true
  queue_ownership: managed_by_harness
  review_policy_version: default
  minimum_sample_percent: 5
  prioritize:
    - failures
    - low_confidence
    - disputed
