judge_setup:
  default_judge_model: gpt-5.4-mini
  default_llm_connection: Azure (Peraton)
  default_sampling_percent: 100
  historical_backfill: disabled

evaluators:
  - name: lists_preserved
    type: llm_as_judge
    version: v3
    dimension: lists_preserved
    source_type: custom
    target: observation
    target_observation_role: model_output
    run_types: &baseline_and_candidate
      - baseline
      - candidate
    mode: single_output
    blind: true
    prompt_path: prompts/dfe/evaluators/lists_preserved.md
    prompt_version: v1
    score:
      name: lists_preserved
      managed_by_harness: true
      data_type: NUMERIC
      min_value: 0
      max_value: 1
      description: Bulleted and numbered lists are retained.
      allowed_score_sources: &llm_and_human_sources
        - llm_judge
        - human_annotation
    required_inputs: &single_output_inputs
      - input
      - output
    variables: &judge_variables
      - input
      - output
    output_schema: &numeric_judge_schema
      reasoning: string
      score:
        type: number
        minimum: 0
        maximum: 1
      confidence:
        type: number
        minimum: 0
        maximum: 1

  - name: formatting_essence_maintained
    type: llm_as_judge
    version: v3
    dimension: formatting_essence_maintained
    source_type: custom
    target: observation
    target_observation_role: model_output
    run_types: *baseline_and_candidate
    mode: single_output
    blind: true
    prompt_path: prompts/dfe/evaluators/formatting_essence_maintained.md
    prompt_version: v1
    score:
      name: formatting_essence
      managed_by_harness: true
      data_type: NUMERIC
      min_value: 0
      max_value: 1
      description: Formatting essence is maintained.
      allowed_score_sources: *llm_and_human_sources
    required_inputs: *single_output_inputs
    variables: *judge_variables
    output_schema: *numeric_judge_schema

  - name: relevance
    type: llm_as_judge
    version: v3
    dimension: relevance
    source_type: catalog
    catalog_ref: Relevance
    target: observation
    target_observation_role: model_output
