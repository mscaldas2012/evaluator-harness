project:
  name: dfe-general-public
  description: Evaluate DFE public health content rewrites for a general public audience.
  version: v1
  score_config_prefix: eh_gp_
  metadata:
    environment: local
    tags:
      - dfe
      - readability
      - general-public

config_refs:
  evaluation: configs/shared/dfe_readability.yaml

scenario:
  group: dfe
  name: general_public
  display_name: General public

dataset:
  kind: local_csv
  path: datasets/DFE.csv
  langfuse_dataset_name: dfe/general-public/v1
  item_id_strategy: explicit_or_hash

task_prompt:
  path: prompts/dfe/task_prompt_generic.md
  version: v1
  template_variables:
    - dataset.input

baseline:
  name: gpt5.2-dgw-default
  provider: openai_compatible
  auth_mode: azure_client_credentials
  model: gpt5.2-dgw-default
  azure:
    tenant_id_env: EDAV_TENANT_ID
    client_id_env: EDAV_CLIENT_ID
    client_secret_env: EDAV_CLIENT_SECRET
    scope_env: EDAV_SCOPE_TOKEN_AUDIENCE
    subscription_key_env: EDAV_SUBSCRIPTION_KEY
    api_version_env: EDAV_AZURE_OPENAI_API_VERSION
    endpoint_env: EDAV_AZURE_OPENAI_ENDPOINT
  parameters:
    temperature: 0.9
    top_p: 0.9
    max_tokens: 4096
    token_limit_parameter: max_completion_tokens

candidates:
  - name: gpt5.2-dgw-default-prompt-consolidated
    provider: openai_compatible
    auth_mode: azure_client_credentials
    model: gpt5.2-dgw-default
    azure:
      tenant_id_env: EDAV_TENANT_ID
      client_id_env: EDAV_CLIENT_ID
      client_secret_env: EDAV_CLIENT_SECRET
      scope_env: EDAV_SCOPE_TOKEN_AUDIENCE
      subscription_key_env: EDAV_SUBSCRIPTION_KEY
      api_version_env: EDAV_AZURE_OPENAI_API_VERSION
      endpoint_env: EDAV_AZURE_OPENAI_ENDPOINT
    task_prompt:
      path: prompts/dfe/task_prompt_generic_consolidated.md
      version: consolidated
      template_variables:
        - dataset.input
    parameters:
      temperature: 0.9
      top_p: 0.9
      max_tokens: 4096
      token_limit_parameter: max_completion_tokens
  - name: dry-run-candidate
    exclude-from-campaign: true
    provider: dry_run
    auth_mode: none
    model: dry-run
    parameters:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 2048
  - name: azure-mistral-large-3
    provider: openai_compatible
    auth_mode: api_key
    model: mistral-large-3
    azure_api_key:
      api_key_env: REWRITE_QUALITY_MISTRAL_LARGE_3_API_KEY
      endpoint_env: REWRITE_QUALITY_MISTRAL_LARGE_3_ENDPOINT
      api_version_env: REWRITE_QUALITY_MISTRAL_LARGE_3_API_VERSION
    parameters:
      temperature: 0.2
      top_p: 1.0
      max_tokens: 2048
      token_limit_parameter: max_completion_tokens
