project:
  name: rewrite-quality
  description: Compare model outputs for a rewrite task.
  version: v1
  score_config_prefix: eh_rewrite_quality_
  metadata:
    environment: local
    tags:
      - rewrite
      - mvp

dataset:
  kind: local_csv
  path: datasets/rewrite_quality.csv
  langfuse_dataset_name: rewrite-quality/v1
  item_id_strategy: explicit_or_hash

task_prompt:
  path: prompts/rewrite_quality/task_prompt.md
  version: v1
  template_variables:
    - input

baseline:
  name: gpt5.2-dgw-default
  provider: openai_compatible
  auth_mode: azure_client_credentials
  model: gpt5.2-dgw-default
  azure:
    tenant_id_env: EDAV_TENANT_ID
    client_id_env: EDAV_CLIENT_ID
    client_secret_env: EDAV_CLIENT_SECRET
    scope_env: EDAV_SCOPE_TOKEN_AUDIENCE
    subscription_key_env: EDAV_SUBSCRIPTION_KEY
    api_version_env: EDAV_AZURE_OPENAI_API_VERSION
    endpoint_env: EDAV_AZURE_OPENAI_ENDPOINT
  parameters:
    temperature: 0.2
    top_p: 1.0
    max_tokens: 2048
    token_limit_parameter: max_completion_tokens

candidates:
  - name: llama3-local
    provider: ollama
    auth_mode: none
    model: llama3
    parameters:
      temperature: 0.2
      top_p: 1.0
      max_tokens: 2048
  - name: llama3-local-temp-high
    provider: ollama
    auth_mode: none
    model: llama3
    parameters:
      temperature: 0.7
      top_p: 1.0
      max_tokens: 2048
  - name: dry-run-candidate
    provider: dry_run
    auth_mode: none
    model: dry-run
    parameters:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 2048

evaluators:
  - name: clarity
    type: llm_as_judge
    version: v1
    dimension: clarity
    target: observation
    target_observation_role: model_output
    target_observation_name: OpenAI-generation
    run_types:
      - baseline
      - candidate
    mode: baseline_comparison
    blind: true
    prompt_path: prompts/rewrite_quality/evaluators/clarity.md
    prompt_version: v1
    score:
      name: clarity
      managed_by_harness: true
      data_type: NUMERIC
      min_value: 0
      max_value: 1
      description: Clarity score from 0.0 to 1.0.
      allowed_score_sources:
        - llm_judge
        - human_annotation
    modes:
      - baseline
      - candidate
    required_inputs:
      - input
      - output
      - baseline_output
    variables:
      - input
      - output
      - baseline_output
      - ground_truth
    output_schema:
      reasoning: string
      score:
        type: number
        minimum: 0
        maximum: 1
      confidence:
        type: number
        minimum: 0
        maximum: 1
    filter_profile:
      target: observation
      observation_role: model_output
      observation_name: OpenAI-generation
      project: rewrite-quality
      project_version: v1
      evaluator_set_id: clarity:v1
      run_types:
        - baseline
        - candidate

human_review:
  enabled: true
  queue_ownership: managed_by_harness
  review_policy_version: default
  minimum_sample_percent: 5
  prioritize:
    - failures
    - low_confidence
    - disputed
