project:
  name: rewrite-quality
  description: Compare model outputs for a rewrite task.
  version: v1
  score_config_prefix: eh_rewrite_quality_
  metadata:
    environment: local
    tags:
      - rewrite
      - mvp

judge_setup:
  default_judge_model: gpt-4.1
  binding_path: configs/langfuse/evaluator_bindings/rewrite-quality.yaml
  default_sampling_percent: 100
  historical_backfill: disabled

dataset:
  kind: local_csv
  path: datasets/rewrite_quality.csv
  langfuse_dataset_name: rewrite-quality/v1
  item_id_strategy: explicit_or_hash

task_prompt:
  path: prompts/rewrite_quality/task_prompt.md
  version: v1
  template_variables:
    - input

baseline:
  name: gpt5.2-dgw-default
  provider: openai_compatible
  auth_mode: azure_client_credentials
  model: gpt5.2-dgw-default
  azure:
    tenant_id_env: EDAV_TENANT_ID
    client_id_env: EDAV_CLIENT_ID
    client_secret_env: EDAV_CLIENT_SECRET
    scope_env: EDAV_SCOPE_TOKEN_AUDIENCE
    subscription_key_env: EDAV_SUBSCRIPTION_KEY
    api_version_env: EDAV_AZURE_OPENAI_API_VERSION
    endpoint_env: EDAV_AZURE_OPENAI_ENDPOINT
  parameters:
    temperature: 0.2
    top_p: 1.0
    max_tokens: 2048
    token_limit_parameter: max_completion_tokens

candidates:
  - name: gpt5.2-dgw-default-prompt-v2
    provider: openai_compatible
    auth_mode: azure_client_credentials
    model: gpt5.2-dgw-default
    azure:
      tenant_id_env: EDAV_TENANT_ID
      client_id_env: EDAV_CLIENT_ID
      client_secret_env: EDAV_CLIENT_SECRET
      scope_env: EDAV_SCOPE_TOKEN_AUDIENCE
      subscription_key_env: EDAV_SUBSCRIPTION_KEY
      api_version_env: EDAV_AZURE_OPENAI_API_VERSION
      endpoint_env: EDAV_AZURE_OPENAI_ENDPOINT
    task_prompt:
      path: prompts/rewrite_quality/task_prompt_v2.md
      version: v2
      template_variables:
        - input
    parameters:
      temperature: 0.2
      top_p: 1.0
      max_tokens: 2048
      token_limit_parameter: max_completion_tokens
  - name: gpt5.2-dgw-default-temp-high
    provider: openai_compatible
    auth_mode: azure_client_credentials
    model: gpt5.2-dgw-default
    azure:
      tenant_id_env: EDAV_TENANT_ID
      client_id_env: EDAV_CLIENT_ID
      client_secret_env: EDAV_CLIENT_SECRET
      scope_env: EDAV_SCOPE_TOKEN_AUDIENCE
      subscription_key_env: EDAV_SUBSCRIPTION_KEY
      api_version_env: EDAV_AZURE_OPENAI_API_VERSION
      endpoint_env: EDAV_AZURE_OPENAI_ENDPOINT
    parameters:
      temperature: 0.8
      top_p: 1.0
      max_tokens: 2048
      token_limit_parameter: max_completion_tokens
  - name: dry-run-candidate
    exclude-from-campaign: true
    provider: dry_run
    auth_mode: none
    model: dry-run
    parameters:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 2048
  - name: azure-mistral-large-3
    provider: openai_compatible
    auth_mode: api_key
    model: mistral-large-3
    azure_api_key:
      api_key_env: REWRITE_QUALITY_MISTRAL_LARGE_3_API_KEY
      endpoint_env: REWRITE_QUALITY_MISTRAL_LARGE_3_ENDPOINT
      api_version_env: REWRITE_QUALITY_MISTRAL_LARGE_3_API_VERSION
    parameters:
      temperature: 0.2
      top_p: 1.0
      max_tokens: 2048
      token_limit_parameter: max_completion_tokens

evaluators:
  - name: clarity
    type: llm_as_judge
    version: v1
    dimension: clarity
    source_type: custom
    target: observation
    target_observation_role: model_output
    run_types:
      - baseline
      - candidate
    mode: baseline_comparison
    blind: true
    prompt_path: prompts/rewrite_quality/evaluators/clarity.md
    prompt_version: v1
    sampling_percent:
    historical_backfill:
    score:
      name: clarity
      managed_by_harness: true
      data_type: NUMERIC
      min_value: 0
      max_value: 1
      description: Clarity score from 0.0 to 1.0.
      allowed_score_sources:
        - llm_judge
        - human_annotation
    modes:
      - baseline
      - candidate
    required_inputs:
      - input
      - output
      - baseline_output
    variables:
      - input
      - output
      - baseline_output
      - ground_truth
    output_schema:
      reasoning: string
      score:
        type: number
        minimum: 0
        maximum: 1
      confidence:
        type: number
        minimum: 0
        maximum: 1
    filter_profile:
      target: observation
      observation_role: model_output
      project: rewrite-quality
      project_version: v1
      evaluator_set_id: clarity:v1
      run_types:
        - baseline
        - candidate

human_review:
  enabled: true
  queue_ownership: managed_by_harness
  review_policy_version: default
  minimum_sample_percent: 5
  prioritize:
    - failures
    - low_confidence
    - disputed
