[project]
name = "evaluator-harness"
version = "0.1.0"
description = "Lightweight Langfuse-first offline evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.16",
    "httpx>=0.27",
    "langfuse>=3.0",
    "openai>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pywin32>=306; platform_system == 'Windows'",
    "PyYAML>=6.0",
    "rich>=13.7",
    "truststore>=0.10.4",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "respx>=0.21",
]

[project.scripts]
evaluator-harness = "evaluator_harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluator_harness"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=evaluator_harness --cov-report=term-missing"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "live: optional smoke tests requiring live external services or credentials",
]

[tool.coverage.run]
branch = true
source = ["evaluator_harness"]

[tool.coverage.report]
show_missing = true
skip_covered = false
