[project]
name = "evaluator-harness"
version = "0.1.0"
description = "Lightweight Langfuse-first offline evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.16",
    "httpx>=0.27",
    "langfuse>=3.0",
    "openai>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pywin32>=306; platform_system == 'Windows'",
    "PyYAML>=6.0",
    "rich>=13.7",
    "truststore>=0.10.4",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.1",
    "pyright>=1.1.390",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "radon>=6.0",
    "respx>=0.21",
    "ruff>=0.8.0",
    "vulture>=2.14",
]

[project.scripts]
evaluator-harness = "evaluator_harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluator_harness"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["evaluator_harness"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = [
    ".venv",
    ".uv-cache",
    ".uv-cache-run",
    ".pytest_cache",
    "graphify-out",
    "reports",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=evaluator_harness --cov-report=term-missing"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "live: optional smoke tests requiring live external services or credentials",
]

[tool.coverage.run]
branch = true
source = ["evaluator_harness"]

[tool.coverage.report]
show_missing = true
skip_covered = false
