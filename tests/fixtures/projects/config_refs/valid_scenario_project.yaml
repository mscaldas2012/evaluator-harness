project:
  name: scenario-config-ref-project
  description: Scenario config ref fixture project.
  version: v1
  score_config_prefix: eh_scenario_config_ref_

scenario:
  group: fixture
  name: scenario_one
  display_name: Scenario One

config_refs:
  evaluation: shared_evaluation.yaml

dataset:
  kind: local_csv
  path: tests/fixtures/datasets/prompt_variables.csv
  langfuse_dataset_name: fixture/scenario-one/v1
  item_id_strategy: explicit_or_hash

task_prompt:
  path: tests/fixtures/prompts/prompt_sync_task.md
  version: v1
  template_variables:
    - dataset.input

baseline:
  name: dry-run-baseline
  provider: dry_run
  auth_mode: none
  model: dry-run
  parameters:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 256

candidates:
  - name: dry-run-candidate
    provider: dry_run
    auth_mode: none
    model: dry-run
    parameters:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 256
