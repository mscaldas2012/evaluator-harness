project:
  name: rewrite-quality
  version: v1
  score_config_prefix: eh_rewrite_quality_

judge_setup:
  default_judge_model: gpt-4.1

dataset:
  kind: local_csv
  path: datasets/rewrite_quality.csv

task_prompt:
  path: prompts/rewrite_quality/task_prompt.md
  version: v1
  template_variables:
    - input

baseline:
  name: baseline
  provider: dry_run
  auth_mode: none
  model: dry-run
  parameters:
    temperature: 0

candidates:
  - name: candidate
    provider: dry_run
    auth_mode: none
    model: dry-run
    parameters:
      temperature: 0

evaluators:
  - name: clarity
    type: llm_as_judge
    version: v1
    dimension: clarity
    source_type: user_owned
    target: observation
    target_observation_role: model_output
    remote_evaluator_id:
    run_types: [baseline, candidate]
    mode: single_output
    score:
      name: clarity
      data_type: NUMERIC
      min_value: 0
      max_value: 1
    required_inputs: [input, output]
    variables: [input, output]
    output_schema:
      reasoning: string
      score:
        type: number
        minimum: 0
        maximum: 1
      confidence:
        type: number
        minimum: 0
        maximum: 1
    filter_profile:
      target: observation
      observation_role: model_output
      project: rewrite-quality
      project_version: v1
      evaluator_set_id: clarity:v1
      run_types: [baseline, candidate]
