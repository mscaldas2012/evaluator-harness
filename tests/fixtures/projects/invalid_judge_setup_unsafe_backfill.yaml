project:
  name: rewrite-quality
  description: Compare model outputs for a rewrite task.
  version: v1
  score_config_prefix: eh_rewrite_quality_

judge_setup:
  default_judge_model: gpt-4.1
  historical_backfill: enabled

dataset:
  kind: local_csv
  path: datasets/rewrite_quality.csv
  langfuse_dataset_name: rewrite-quality/v1
  item_id_strategy: explicit_or_hash

task_prompt:
  path: prompts/rewrite_quality/task_prompt.md
  version: v1
  template_variables:
    - input

baseline:
  name: gpt-4.1-baseline
  provider: openai_compatible
  auth_mode: azure_client_credentials
  model: gpt-4.1
  azure:
    tenant_id_env: EDAV_TENANT_ID
    client_id_env: EDAV_CLIENT_ID
    client_secret_env: EDAV_CLIENT_SECRET
    scope_env: EDAV_SCOPE_TOKEN_AUDIENCE
    subscription_key_env: EDAV_SUBSCRIPTION_KEY
    api_version_env: EDAV_AZURE_OPENAI_API_VERSION
    endpoint_env: EDAV_AZURE_OPENAI_ENDPOINT
  parameters:
    temperature: 0.2

candidates:
  - name: llama3-local
    provider: ollama
    auth_mode: none
    model: llama3
    parameters:
      temperature: 0.2

evaluators:
  - name: clarity
    type: llm_as_judge
    version: v1
    dimension: clarity
    source_type: custom
    target: observation
    target_observation_role: model_output
    run_types:
      - baseline
      - candidate
    mode: baseline_comparison
    prompt_path: prompts/rewrite_quality/evaluators/clarity.md
    prompt_version: v1
    score:
      name: clarity
      managed_by_harness: true
      data_type: NUMERIC
      min_value: 0
      max_value: 1
      allowed_score_sources:
        - llm_judge
        - human_annotation
    required_inputs:
      - input
      - output
      - baseline_output
    variables:
      - input
      - output
      - baseline_output
    output_schema:
      reasoning: string
      score:
        type: number
        minimum: 0
        maximum: 1
      confidence:
        type: number
        minimum: 0
        maximum: 1
    filter_profile:
      target: observation
      observation_role: model_output
      project: rewrite-quality
      project_version: v1
      evaluator_set_id: clarity:v1
      run_types:
        - baseline
        - candidate
