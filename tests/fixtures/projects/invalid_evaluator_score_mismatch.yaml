project:
  name: rewrite-quality
  version: v1
  score_config_prefix: eh_rewrite_quality_
dataset:
  kind: local_csv
  path: datasets/rewrite_quality.csv
task_prompt:
  path: prompts/rewrite_quality/task_prompt.md
  version: v1
baseline:
  name: baseline
  provider: dry_run
  auth_mode: none
  model: dry-run
  parameters:
    temperature: 0
candidates:
  - name: candidate
    provider: dry_run
    auth_mode: none
    model: dry-run
    parameters:
      temperature: 0
evaluators:
  - name: clarity
    type: llm_as_judge
    version: v1
    dimension: clarity
    target: observation
    prompt_path: prompts/rewrite_quality/evaluators/clarity.md
    prompt_version: v1
    score:
      name: clarity_auto
      data_type: NUMERIC
      min_value: 0
      max_value: 1
    run_types: [baseline, candidate]
    mode: single_output
    required_inputs: [input, output]
    output_schema:
      reasoning: string
      score:
        type: number
        minimum: 0
        maximum: 1
      confidence:
        type: number
        minimum: 0
        maximum: 1
    filter_profile:
      target: observation
      observation_role: model_output
      project: rewrite-quality
      project_version: v1
      evaluator_set_id: clarity:v1
      run_types: [baseline, candidate]
human_review:
  enabled: true
  queue_ownership: managed_by_harness
  score_configs:
    - clarity
