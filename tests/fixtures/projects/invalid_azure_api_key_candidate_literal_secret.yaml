project:
  name: invalid-api-key-secret-project
  version: v1
  score_config_prefix: eh_invalid_secret_

dataset:
  kind: local_csv
  path: datasets/rewrite_quality.csv

task_prompt:
  path: prompts/rewrite_quality/task_prompt.md
  version: v1

baseline:
  name: dry-run-baseline
  provider: dry_run
  auth_mode: none
  model: dry-run
  parameters:
    temperature: 0.0

candidates:
  - name: azure-api-key-candidate
    provider: openai_compatible
    auth_mode: api_key
    model: mistral-large-3
    azure_api_key:
      api_key_env: sk-real-secret-value
      endpoint_env: https://sensitive.example.openai.azure.com
      api_version_env: 2024-12-01-preview
    parameters:
      temperature: 0.2

evaluators:
  - name: clarity
    type: llm_as_judge
    version: v1
    prompt_path: prompts/rewrite_quality/evaluators/clarity.md
    score:
      name: clarity
      data_type: NUMERIC
      min_value: 0
      max_value: 1
    variables: [input, output]
