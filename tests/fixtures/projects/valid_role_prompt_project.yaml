project:
  name: role-prompt-project
  version: v1
  score_config_prefix: eh_role_prompt_

judge_setup:
  default_judge_model: gpt-4.1
  binding_path: configs/langfuse/evaluator_bindings/rewrite-quality.yaml

dataset:
  kind: local_csv
  path: tests/fixtures/datasets/prompt_variables.csv
  langfuse_dataset_name: role-prompt-project/v1
  item_id_strategy: explicit_or_hash

task_prompt:
  path: tests/fixtures/prompts/role_based_task_prompt.md
  version: v1
  template_variables:
    - dataset.input
    - dataset.ground_truth

baseline:
  name: dry-run-baseline
  provider: dry_run
  auth_mode: none
  model: dry-run
  parameters:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 2048

candidates:
  - name: dry-run-role-prompt-v2
    provider: dry_run
    auth_mode: none
    model: dry-run
    task_prompt:
      path: tests/fixtures/prompts/role_based_task_prompt_empty.md
      version: v2
      template_variables:
        - dataset.input
        - dataset.optional_note
    parameters:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 2048

evaluators:
  - name: clarity
    type: llm_as_judge
    version: v1
    source_type: custom
    target: observation
    target_observation_role: model_output
    run_types:
      - baseline
      - candidate
    mode: baseline_comparison
    blind: true
    prompt_path: prompts/rewrite_quality/evaluators/clarity.md
    prompt_version: v1
    score:
      name: clarity
      managed_by_harness: true
      data_type: NUMERIC
      min_value: 0
      max_value: 1
    required_inputs:
      - input
      - output
      - baseline_output
    variables:
      - input
      - output
      - baseline_output
      - ground_truth
    output_schema:
      reasoning: string
      score:
        type: number
        minimum: 0
        maximum: 1
      confidence:
        type: number
        minimum: 0
        maximum: 1
